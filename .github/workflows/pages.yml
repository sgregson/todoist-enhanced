name: Deploy to GitHub Pages

# Builds this repository for its own Pages address and publishes it there.
# Once per repository: Settings → Pages → Source: GitHub Actions (and, on a
# fork, enable workflows in the Actions tab). See docs/deploying.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # configure-pages reads the site's address
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A failing test means this build does not replace the one already live.
      - run: npm test
      # The Pages address, custom domain included. "Continue with Todoist"
      # identifies the app by oauth/client.json at exactly this address.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm run build
        env:
          # The repository variable PUBLIC_URL, when set, wins over the Pages address.
          PUBLIC_URL: ${{ vars.PUBLIC_URL || steps.pages.outputs.base_url }}
      - name: Check the build carries its security policy and sign-in document
        run: |
          grep -q 'http-equiv="Content-Security-Policy"' dist/index.html
          grep -q "\"client_id\": \"${PUBLIC_URL%/}/oauth/client.json\"" dist/oauth/client.json
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL || steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
